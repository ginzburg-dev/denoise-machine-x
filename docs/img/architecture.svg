<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b82"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="378" rx="16" fill="#0f1420" stroke="#232a3a"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#e6edf3">DenoiseMachineX<tspan fill="#8b949e" font-weight="400"> · architecture</tspan></text>

  <!-- flow arrows -->
  <text x="203" y="150" font-size="10" fill="#6b7688" text-anchor="middle">ImageIO</text>
  <path d="M182,162 L220,162" stroke="#5b6b82" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M404,162 L430,162" stroke="#5b6b82" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="669" y="150" font-size="10" fill="#6b7688" text-anchor="middle">ImageIO</text>
  <path d="M648,162 L686,162" stroke="#5b6b82" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <!-- A: input -->
  <rect x="32" y="118" width="150" height="92" rx="12" fill="#161c2b" stroke="#2a3346"/>
  <text x="107" y="158" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">EXR + AOVs</text>
  <text x="107" y="180" font-size="10" fill="#8b949e" text-anchor="middle">albedo · normal · depth</text>

  <!-- B: image model -->
  <rect x="226" y="118" width="178" height="92" rx="12" fill="#161c2b" stroke="#2a3346"/>
  <text x="315" y="150" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">DMXImage</text>
  <text x="315" y="170" font-size="10" fill="#8b949e" text-anchor="middle">multi-layer · multi-frame</text>
  <text x="315" y="188" font-size="10" fill="#8b949e" text-anchor="middle">LayerDictionary · ChannelBuffer</text>

  <!-- C: filter chain -->
  <rect x="436" y="104" width="212" height="150" rx="12" fill="#141b29" stroke="#2a3346"/>
  <text x="542" y="128" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Filter chain</text>
  <text x="542" y="146" font-size="10" fill="#8b949e" text-anchor="middle">via FilterFactory</text>
  <rect x="452" y="156" width="180" height="26" rx="8" fill="#102a2b" stroke="#2f7d70"/>
  <text x="542" y="173" font-size="11" fill="#7fe4d2" text-anchor="middle">Non-Local Means</text>
  <rect x="452" y="188" width="180" height="26" rx="8" fill="#102a2b" stroke="#2f7d70"/>
  <text x="542" y="205" font-size="11" fill="#7fe4d2" text-anchor="middle">Convolution — CPU / CUDA</text>
  <rect x="452" y="220" width="180" height="26" rx="8" fill="none" stroke="#3a4354" stroke-dasharray="4 3"/>
  <text x="542" y="237" font-size="11" fill="#6b7480" text-anchor="middle">Temporal — planned</text>

  <!-- D: output -->
  <rect x="692" y="118" width="136" height="92" rx="12" fill="#161c2b" stroke="#2a3346"/>
  <text x="760" y="158" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Denoised EXR</text>
  <text x="760" y="180" font-size="10" fill="#8b949e" text-anchor="middle">multi-layer output</text>

  <!-- runtime bar -->
  <path d="M542,254 L542,300" stroke="#2a3346" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <rect x="226" y="300" width="422" height="40" rx="10" fill="#12182b" stroke="#2a3346" stroke-dasharray="5 4"/>
  <text x="437" y="325" font-size="11" fill="#9aa4b2" text-anchor="middle">Runtime  ·  ThreadPool  ·  Parallel  ·  CUDA (optional)</text>

  <text x="828" y="366" font-size="10" fill="#5b6472" text-anchor="end">solid = implemented   ·   dashed = planned</text>
</svg>
